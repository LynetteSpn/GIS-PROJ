<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RMIS v2 - Dev Login</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-card {
            background: white;
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            width: 350px;
            text-align: center;
        }
        h2 { color: #2c3e50; margin-bottom: 0.5rem; }
        p { color: #7f8c8d; margin-bottom: 1.5rem; font-size: 0.9rem; }
        
        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 16px;
        }
        
        button {
            width: 100%;
            padding: 12px;
            background-color: #094e1e;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            margin-top: 15px;
            transition: background 0.3s;
        }
        button:hover { background-color: #034617; }
        
        #error-msg { 
            color: #e74c3c; 
            margin-top: 15px; 
            font-size: 14px; 
            display: none; 
            background: #fadbd8;
            padding: 10px;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <h2>Road Map Viewer Login</h2>
        
        <input type="text" id="username" placeholder="User ID " />
        
        <button onclick="login()">Enter System</button>
        <div id="error-msg">User ID not found</div>
    </div>

    <script>
        async function login() {
            const username = document.getElementById('username').value;
            const errorMsg = document.getElementById('error-msg');

            // Reset error
            errorMsg.style.display = 'none';

            if (!username) {
                errorMsg.textContent = "Please enter a User ID";
                errorMsg.style.display = 'block';
                return;
            }

            try {
                // Send the ID to your Node.js server
                const response = await fetch('https://10.1.4.27:3005/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: username }) 
                });

                const data = await response.json();

                if (data.success) {
                    // 1. Save the user details in browser memory
                    localStorage.setItem('currentUser', JSON.stringify(data.user));
                    
                    // 2. Redirect to your map page
                    // Make sure your main map file is named 'index.html'
                    window.location.href = 'index.html'; 
                } else {
                    // Show error if ID is wrong
                    errorMsg.textContent = data.message;
                    errorMsg.style.display = 'block';
                }
            } catch (err) {
                console.error(err);
                errorMsg.textContent = "Server Error. Is Node running?";
                errorMsg.style.display = 'block';
            }
        }
        
        // Optional: Allow pressing "Enter" key to login
        document.getElementById("username").addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                login();
            }
        });
    </script>
</body>
</html>
